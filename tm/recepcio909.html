<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Recepció GLS 909</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#eef0f8;color:#0b1446}
  header{background:#061ab1;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
  header h1{font-size:22px}header h1 b{color:#ffd400}
  .st{display:flex;gap:18px;font-size:14px}.st div{text-align:center}.st b{display:block;font-size:22px;color:#ffd400}
  #so{background:#ffd400;color:#061ab1;border:0;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer}
  main{padding:16px 20px}
  h2{font-size:16px;text-transform:uppercase;letter-spacing:1px;color:#5a6290;margin:6px 0 10px}
  #pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;margin-bottom:22px}
  .t{background:#fff;border-radius:14px;box-shadow:0 2px 8px #0b144622;overflow:hidden;border-left:10px solid #18a34a}
  .t.nou{animation:flash 1s 4}
  @keyframes flash{50%{background:#fff3c4}}
  .t.taronja{border-color:#f59e0b}.t.vermell{border-color:#e11d48}
  .th{display:flex;align-items:center;gap:14px;padding:12px 14px 6px}
  .num{font-size:44px;font-weight:800;color:#061ab1;min-width:70px}
  .hm{font-size:14px;color:#5a6290}.hm b{color:#0b1446;font-size:18px}
  .esp.alta{color:#e11d48;font-weight:800}
  .exp{padding:6px 14px;border-top:1px solid #eef0f8;font-size:15px}
  .exp .c{font-family:Consolas,monospace;font-size:19px;font-weight:700}
  .bd{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;color:#fff;background:#18a34a;margin-left:6px;vertical-align:middle}
  .bd.cami{background:#f59e0b}.bd.rep,.bd.taulell{background:#e11d48}.bd.lliurat,.bd.ps,.bd.locker{background:#3b82f6}.bd.prem{background:#7c3aed}
  .cob{background:#fff3c4;border-radius:6px;padding:3px 8px;margin-top:4px;font-weight:700;display:inline-block}
  .nota{color:#e11d48;font-weight:700}
  .acc{display:flex;gap:8px;padding:10px 14px 12px}
  .acc button{flex:1;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:800;cursor:pointer}
  .ok{background:#18a34a;color:#fff}.ko{background:#e5e7f2;color:#0b1446}
  .buit{color:#5a6290;font-size:18px;padding:30px;text-align:center;background:#fff;border-radius:14px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
  td{padding:7px 10px;border-top:1px solid #eef0f8}
  td button{border:0;background:#e5e7f2;border-radius:6px;padding:4px 8px;cursor:pointer}
  #err{color:#e11d48;font-weight:700;padding:4px 20px}
</style>
</head>
<body>
<header>
  <h1>Recepció nau GLS <b>909</b> · clients en espera</h1>
  <div class="st" id="st"></div>
  <button id="so">🔔 Activar so</button>
</header>
<div id="err"></div>
<main>
  <h2>En espera</h2>
  <div id="pend"><div class="buit">Carregant…</div></div>
  <h2>Últims atesos</h2>
  <table id="fets"></table>
</main>
<script>
const URL_CUA = 'https://script.google.com/macros/s/AKfycbxl2jUbf_hVLsD31bl8Hl9dyUiYoeW4hhEtxgHY-HamuxAre9tx3SZVMYaBi7wkI0fU/exec';
const CLAU = (new URLSearchParams(location.hash.slice(1))).get('k') || '';
async function crida(o) { const r = await fetch(URL_CUA, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ k: CLAU }, o)) }); return r.json(); }
const CAT = { aqui: 'A LA NAU', cami: 'NO ARRIBAT', lliurat: 'LLIURAT', ps: 'AL PS', locker: 'LOCKER', rep: 'EN REPARTO', taulell: 'REVISAR' };
let vistos = null, soOn = false, AC = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = n => (+n || 0).toFixed(2).replace('.', ',') + ' €';
const min = s => { const p = String(s || '').split(':').map(Number); return p[0] * 60 + (p[1] || 0) + (p[2] || 0) / 60; };

document.getElementById('so').onclick = () => {
  soOn = !soOn; document.getElementById('so').textContent = soOn ? '🔔 So activat' : '🔕 Activar so';
  if (soOn) { try { AC = AC || new AudioContext(); AC.resume(); } catch (e) { } beep(); }
};
function beep() {
  if (!soOn) return;
  try {
    AC = AC || new AudioContext();
    [[880, 0], [1175, .18]].forEach(([f, t]) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; g.gain.value = .25; o.connect(g); g.connect(AC.destination); o.start(AC.currentTime + t); o.stop(AC.currentTime + t + .15); });
  } catch (e) { }
}
function parla(t) {
  if (!soOn) return;
  try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ca-ES'; const v = speechSynthesis.getVoices().find(x => /^ca/i.test(x.lang)) || speechSynthesis.getVoices().find(x => /^es/i.test(x.lang)); if (v) { u.voice = v; u.lang = v.lang; } setTimeout(() => speechSynthesis.speak(u), 500); } catch (e) { }
}

let ocupat = false;
async function carrega() {
  if (ocupat) return; ocupat = true;
  try { const d = await crida({ a: 'list' }); if (d && d.pend) pinta(d); else throw new Error(d && d.error || 'resposta buida'); }
  catch (e) { document.getElementById('err').textContent = 'Sense connexió: ' + (e && e.message || e); }
  finally { ocupat = false; }
}
function pinta(d) {
  document.getElementById('err').textContent = '';
  const s = d.st || {};
  document.getElementById('st').innerHTML =
    `<div><b>${d.pend.length}</b>en espera</div><div><b>${s.atesos || 0}</b>atesos avui</div>` +
    `<div><b>${s.esperaMitjana == null ? '–' : String(s.esperaMitjana).replace('.', ',') + "'"}</b>espera mitjana</div>` +
    `<div><b>${s.consultes || 0}</b>consultes</div><div><b>${s.noArribats || 0}</b>no arribats</div>`;
  const ara = min(d.ara);
  const nous = vistos ? d.pend.filter(t => !vistos.has(t.fila)) : [];
  document.getElementById('pend').innerHTML = d.pend.length ? d.pend.map(t => {
    const items = (t.det && t.det.items) || [];
    const cats = items.map(i => i.cat);
    const color = cats.includes('aqui') ? '' : cats.some(c => c === 'rep' || c === 'taulell') || !items.length ? 'vermell' : 'taronja';
    const esp = Math.max(0, Math.round(ara - min(t.hora)));
    const exps = items.length ? items.map(i => `<div class="exp"><span class="c">${esc(i.exp)}</span><span class="bd ${i.cat}">${CAT[i.cat] || i.stn}</span>${i.prem ? `<span class="bd prem">${esc(i.prem)}</span>` : ''}
        <div>${esc(i.nom)} · ${i.bul || '?'} bult. · ${String(i.kg || 0).replace('.', ',')} kg${i.ps ? ' · PS ' + esc(i.ps) : ''}</div>
        <div style="color:#5a6290">${esc(i.adr)}${i.rem ? ' · Rem.: ' + esc(i.rem) : ''}</div>
        ${i.cod + i.due > 0 ? `<div class="cob">💶 Cobrar ${eur(i.cod + i.due)}${i.cod > 0 ? ' (reemb. ' + eur(i.cod) + ')' : ''}${i.due > 0 ? ' (ports deguts ' + eur(i.due) + ')' : ''}</div>` : ''}
        ${i.cat === 'rep' ? '<div class="nota">Atlas diu EN REPARTO: comprovar si és a la fulla d\'un repartidor</div>' : ''}
        ${i.cat === 'taulell' ? '<div class="nota">Estat: ' + esc(i.stn) + '</div>' : ''}
      </div>`).join('') : '<div class="exp nota">Vol parlar amb recepció (no hi ha cap paquet trobat)</div>';
    return `<div class="t ${color} ${nous.some(n => n.fila === t.fila) ? 'nou' : ''}">
      <div class="th"><div class="num">${esc(t.torn)}</div><div class="hm"><b>${esc(t.hora.slice(0, 5))}</b> · per ${esc(t.via.toLowerCase())}<br><span class="esp ${esp >= 5 ? 'alta' : ''}">esperant ${esp} min</span>${t.det && t.det.lang && t.det.lang !== 'ca' ? ' · idioma ' + esc(t.det.lang.toUpperCase()) : ''}</div></div>
      ${exps}
      <div class="acc"><button class="ok" onclick="marca(${t.fila},'LLIURAT')">✔ Lliurat</button><button class="ko" onclick="marca(${t.fila},'NO HI ÉS')">✖ No hi és / altres</button></div></div>`;
  }).join('') : '<div class="buit">Cap client en espera</div>';
  document.getElementById('fets').innerHTML = (d.fets || []).map(t => `<tr><td><b>${esc(t.torn)}</b></td><td>${esc(t.hora.slice(0, 5))}</td><td>${esc(((t.det && t.det.items) || []).map(i => i.exp).join(', '))}</td><td>${esc(t.estat)} ${esc(String(t.hAtes).slice(0, 5))}</td><td>${esc(t.espera)}'</td><td><button onclick="marca(${t.fila},'PENDENT')">Desfer</button></td></tr>`).join('');
  if (nous.length) { beep(); parla(nous.map(n => 'Torn ' + n.torn).join('. ')); }
  vistos = new Set(d.pend.map(t => t.fila));
}
async function marca(fila, estat) {
  try { await crida({ a: 'marca', fila, estat }); } catch (e) { document.getElementById('err').textContent = 'No s\'ha pogut desar: ' + (e && e.message || e); }
  ocupat = false; carrega();
}
if (!CLAU) document.getElementById('pend').innerHTML = '<div class="buit">Falta la clau a l\'enllaç.</div>';
if (CLAU) { carrega(); setInterval(carrega, 4000); }
</script>
</body>
</html>
